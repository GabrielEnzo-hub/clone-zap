<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Clone WhatsApp - Completo</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body class="theme-dark">

  <!-- CÂMERA MODAL -->
  <div id="camera-modal" class="modal">
    <div class="camera-toolbar"><button class="btn-icon" onclick="fecharCamera()">✖</button></div>
    <div class="camera-body">
      <video id="camera-stream" autoplay playsinline></video>
      <canvas id="camera-canvas" style="display: none;"></canvas>
      <img id="camera-preview" style="display: none; width: 100%; height: 100%; object-fit: cover;">
    </div>
    <div class="camera-controls">
      <button id="btn-take-photo" class="camera-shutter"></button>
      <button id="btn-retake-photo" class="btn-icon" style="display: none;" title="Tirar outra">🔄</button>
      <button id="btn-send-photo" class="btn-send" style="display: none; width: 50px; height: 50px; border-radius: 50%;"><svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M1.101 21.757L23.8 12.028 1.101 2.3l.011 7.912 13.623 1.816-13.623 1.817-.011 7.912z"></path></svg></button>
    </div>
  </div>

  <div id="media-modal" class="modal">
    <div class="modal-toolbar"><button class="btn-icon" onclick="zoomIn()">➕</button><button class="btn-icon" onclick="zoomOut()">➖</button><div style="width: 20px;"></div><button class="btn-icon close-modal" onclick="fecharModal()">✖</button></div>
    <div class="modal-body" id="modal-body"></div>
  </div>

  <div id="theme-modal" class="modal">
    <div class="theme-box fade-in-content">
      <h2 style="color: var(--text-primary); margin-bottom: 20px; font-weight: 500;">Escolha um Tema</h2>
      <div class="theme-options">
        <div class="theme-circle" style="background: #111b21; border-color: #00a884;" onclick="mudarTema('dark')"></div>
        <div class="theme-circle" style="background: #eae6df; border-color: #008069;" onclick="mudarTema('light')"></div>
        <div class="theme-circle" style="background: #282a36; border-color: #ff79c6;" onclick="mudarTema('dracula')"></div>
        <div class="theme-circle" style="background: #000000; border-color: #00ff00;" onclick="mudarTema('hacker')"></div>
      </div>
      <button class="btn-send" style="margin-top: 25px; width: 100%; border-radius: 8px;" onclick="fecharModalTema()">Fechar</button>
    </div>
  </div>

  <div id="toast-container"></div>
  <div id="undo-snackbar" class="snackbar">Mensagem apagada. <button id="btn-undo">Desfazer</button></div>

  <div class="app-container">
    <div class="sidebar-wrapper">
      
      <!-- Gaveta Perfil -->
      <div id="my-profile-drawer" class="drawer left-drawer">
        <header class="drawer-header"><button class="btn-icon" onclick="fecharMeuPerfil()"><svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 4l1.4 1.4L7.8 11H20v2H7.8l5.6 5.6L12 20l-8-8 8-8z"></path></svg></button><h2>Perfil</h2></header>
        <div class="drawer-body">
          <div class="profile-big-avatar-container">
            <div class="profile-big-avatar" id="my-profile-avatar">Eu</div>
            <div class="avatar-overlay">
              <div class="overlay-action" onclick="visualizarMinhaFoto(event)"><span style="font-size: 20px;">👁️</span><span>VER</span></div>
              <div class="overlay-action" onclick="document.getElementById('my-avatar-input').click(); event.stopPropagation();"><span style="font-size: 20px;">📷</span><span>MUDAR</span></div>
            </div>
            <input type="file" id="my-avatar-input" accept="image/*" style="display: none;">
          </div>
          <div class="profile-info-block">
            <label>Seu nome</label>
            <div class="editable-row"><div class="profile-text" id="my-name-display">Administrador</div><input type="text" id="my-name-input" class="profile-edit-input" style="display:none;" maxlength="25"><button class="btn-icon edit-btn" id="btn-edit-name" onclick="iniciarEdicao('name')">✎</button><button class="btn-icon save-btn" id="btn-save-name" style="display:none;" onclick="salvarEdicao('name')">✔</button></div>
          </div>
          <div class="profile-info-desc">Esse nome será visível para seus contatos.</div>
          <div class="profile-info-block">
            <label>Recado</label>
            <div class="editable-row"><div class="profile-text" id="my-bio-display">Disponível</div><input type="text" id="my-bio-input" class="profile-edit-input" style="display:none;" maxlength="139"><button class="btn-icon edit-btn" id="btn-edit-bio" onclick="iniciarEdicao('bio')">✎</button><button class="btn-icon save-btn" id="btn-save-bio" style="display:none;" onclick="salvarEdicao('bio')">✔</button></div>
          </div>
        </div>
      </div>

      <div id="archived-drawer" class="drawer left-drawer">
        <header class="drawer-header"><button class="btn-icon" onclick="fecharArquivadas()"><svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 4l1.4 1.4L7.8 11H20v2H7.8l5.6 5.6L12 20l-8-8 8-8z"></path></svg></button><h2>Arquivadas</h2></header>
        <div class="chat-list" id="archived-list"></div>
      </div>

      <aside class="sidebar">
        <header class="header">
          <div class="avatar" id="sidebar-my-avatar" style="cursor: pointer;" onclick="abrirMeuPerfil()">Eu</div>
          <div style="display: flex; gap: 10px;"><button class="btn-icon" onclick="abrirModalTema()">🎨</button><button id="btn-simular-externa" class="btn-icon">🔔</button></div>
        </header>
        <div id="btn-show-archived" class="archived-header-btn" onclick="abrirArquivadas()" style="display: none;"><span>📦 Arquivadas</span><span id="archived-count" class="archived-count">0</span></div>
        <div class="chat-list" id="sidebar-list"></div>
      </aside>
    </div>

    <main class="chat-area">
      <header class="header" id="chat-header" style="cursor: pointer;" onclick="abrirPerfilContato()">
        <div class="chat-header-info">
          <div class="avatar" id="header-avatar"></div>
          <div class="chat-header-text"><div class="chat-title" id="header-name"></div><div class="chat-subtitle" id="header-status" style="display: none;"></div></div>
        </div>
      </header>

      <header class="header selection-header" id="selection-header">
        <div class="selection-left"><button class="btn-icon" onclick="sairModoSelecao()">❌</button><span id="selection-count">1 selecionada</span></div><button class="btn-icon" onclick="apagarMensagensSelecionadas()">🗑️</button>
      </header>
      
      <div class="chat-window-bg"></div>
      <div class="chat-window" id="chat-window" onclick="fecharMenus()"></div>
      <button id="btn-scroll-bottom" onclick="scrollToBottom()"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 21l-8-8h5V3h6v10h5z"></path></svg></button>

      <footer class="chat-footer">
        <div id="emoji-picker" class="emoji-picker"></div>
        <div id="attach-menu" class="attach-menu">
           <div class="attach-item" onclick="abrirCamera()"><div class="attach-icon" style="background: #D3396D;">📷</div> <span>Câmera</span></div>
           <div class="attach-item" onclick="document.getElementById('file-input').click()"><div class="attach-icon" style="background: #BF59CF;">🖼️</div> <span>Fotos/Vídeos</span></div>
        </div>

        <div class="footer-left">
          <button id="btn-attach-menu" class="btn-icon" title="Anexar"><svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M12 20.664a9.163 9.163 0 0 1-6.521-2.702.977.977 0 0 1 1.381-1.381 7.21 7.21 0 0 0 10.28 0 .978.978 0 0 1 1.381 1.381A9.164 9.164 0 0 1 12 20.664zM4.146 13.348a.976.976 0 0 1-.977-.977 8.814 8.814 0 0 1 17.628 0 .977.977 0 0 1-1.954 0 6.86 6.86 0 0 0-13.72 0 .976.976 0 0 1-.977.977zM12 15a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm0-4.047a1.047 1.047 0 1 0 0 2.094 1.047 1.047 0 0 0 0-2.094z"></path></svg></button>
          <button id="btn-emoji" class="btn-icon" title="Emojis"><svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M9.153 11.603c.795 0 1.439-.879 1.439-1.962s-.644-1.962-1.439-1.962-1.439.879-1.439 1.962.644 1.962 1.439 1.962zm-3.204 1.362c-.026-.307-.131 5.218 6.063 5.551 6.066-.25 6.066-5.551 6.066-5.551-6.078 1.416-12.129 0-12.129 0zm11.3631.135h-.002c0 .001.002-.001.002 0zm-2.463-3.46c.795 0 1.439-.879 1.439-1.962s-.644-1.962-1.439-1.962-1.439.879-1.439 1.962.644 1.962 1.439 1.962zM12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zM12 20.5c-4.687 0-8.5-3.813-8.5-8.5s3.813-8.5 8.5-8.5 8.5 3.813 8.5 8.5-3.813 8.5-8.5 8.5z"></path></svg></button>
          <input type="file" id="file-input" accept="image/*, video/*" style="display: none;">
        </div>
        
        <input type="text" id="message-input" placeholder="Mensagem" autocomplete="off">
        
        <div class="footer-right">
          <div id="recording-controls">
             <button id="btn-cancel-mic" class="btn-icon" style="color: #f15c6d;"><svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M19.8 5.8l-1.6-1.6-6.2 6.2-6.2-6.2-1.6 1.6 6.2 6.2-6.2 6.2 1.6 1.6 6.2-6.2 6.2 6.2 1.6-1.6-6.2-6.2 6.2-6.2z"></path></svg></button>
             <div style="display: flex; align-items: center; gap: 8px;"><div class="red-dot"></div><span id="recording-time" class="recording-timer">00:00</span></div>
          </div>
          <button id="btn-action-main" class="btn-icon"><svg id="svg-mic" viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M11.999 14.942c2.001 0 3.531-1.53 3.531-3.531V4.35c0-2.001-1.53-3.531-3.531-3.531S8.469 2.349 8.469 4.35v7.061c0 2.001 1.53 3.531 3.53 3.531zm6.238-3.53c0 3.531-2.942 6.002-6.237 6.002s-6.237-2.471-6.237-6.002H3.761c0 4.001 3.178 7.297 7.061 7.885v3.884h2.354v-3.884c3.884-.588 7.061-3.884 7.061-7.885h-2.002z"></path></svg></button>
        </div>
      </footer>

      <div id="contact-profile-drawer" class="drawer right-drawer">
        <header class="drawer-header"><button class="btn-icon" onclick="fecharPerfilContato()"><svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M19.8 5.8l-1.6-1.6-6.2 6.2-6.2-6.2-1.6 1.6 6.2 6.2-6.2 6.2 1.6 1.6 6.2-6.2 6.2 6.2 1.6-1.6-6.2-6.2 6.2-6.2z"></path></svg></button><h2>Dados do contato</h2></header>
        <div class="drawer-body">
          <div class="profile-big-avatar" id="contact-big-avatar"></div>
          <h2 class="contact-big-name" id="contact-big-name">Nome</h2>
          <div class="contact-big-phone" id="contact-big-phone">+55 00 00000-0000</div>
          <div class="profile-info-block" style="margin-top: 20px;"><label>Recado</label><div class="profile-text" id="contact-big-bio">...</div></div>
        </div>
      </div>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
